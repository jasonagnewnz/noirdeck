[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "noirdeck"
version = "0.28.0"
description = "Local-first companion console for a Claude Code estate"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["claude", "cli", "local-first", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  # Source-available, NOT open source. The governing terms are the bespoke NOIRDECK
  # SOFTWARE LICENCE AGREEMENT in ./LICENSE (v1.1) — free for personal use, and free
  # for commercial use during Early Access under cl. 3A. This comment previously
  # named PolyForm Internal Use 1.0.0, which appears nowhere in that agreement; the
  # `license` field above has always pointed at the real file, but the stale comment
  # would have told the next reader the wrong terms govern. No OSI-approved
  # classifier fits, and claiming one would misrepresent the licence on PyPI.
  "License :: Other/Proprietary License",
  # ⛔ POSIX only, and this is not a preference. workspace.py imports pty, termios
  # and fcntl at module top level and main.py imports workspace, so on native
  # Windows noirdeck fails at IMPORT time — there is nothing to install. Windows
  # users run it under WSL, which is Linux. Do not add a Windows classifier without
  # a ConPTY implementation behind it.
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.3",
  "watchfiles>=1.0.4",
  "PyYAML>=6.0.2",
  # Ed25519 verification for licence keys. Vetted library, never hand-rolled
  # crypto — see backend/noirdeck/licensing.py.
  "cryptography>=44",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "httpx>=0.28.1", "ruff>=0.15.1"]

[project.scripts]
noirdeck = "noirdeck.cli:main"

# The built SPA is copied to backend/noirdeck/web by `make bundle` before a
# release build. It is generated (so gitignored), and `artifacts` is what makes
# hatchling ship a gitignored path anyway.
[tool.hatch.build]
artifacts = ["backend/noirdeck/web/**"]

[tool.hatch.build.targets.wheel]
packages = ["backend/noirdeck"]

[tool.hatch.build.targets.sdist]
include = [
  "backend",
  "frontend/src",
  "frontend/package.json",
  "frontend/package-lock.json",
  "frontend/vite.config.js",
  "docs",
  "ops",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "Makefile",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["noirdeck"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
