name: release

# Publishes on a version tag. The wheel carries the built SPA, so the release
# artifact is the whole product: `pipx install noirdeck` and run it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Build SPA and bundle it into the package
        run: |
          cd frontend && npm ci --no-fund --no-audit && npm run build && cd ..
          rm -rf backend/noirdeck/web
          cp -r frontend/dist backend/noirdeck/web

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build

      - name: Verify the tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$PKG" || { echo "tag $TAG != pyproject $PKG"; exit 1; }
          ls dist/ | grep -q "noirdeck-$PKG-py3-none-any.whl"

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/noirdeck --version
          # the SPA must be inside the wheel, not resolved from this checkout
          /tmp/smoke/bin/python -c "import noirdeck.paths as p; assert p.web_dir() is not None, 'SPA missing from wheel'"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC: PyPI trusted publishing + keyless signing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Keyless: the signing identity is this workflow, so there is no long-lived
      # key to hold or rotate. Signs the SBOM too — an unattributable SBOM is
      # one of the 17 minimum elements missing.
      - name: Sign artifacts and SBOM
        uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84 # v3.0.1
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz ./dist/sbom.cyclonedx.json

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # trusted publishing (OIDC) — no API token stored anywhere
          skip-existing: true
          packages-dir: dist/
          # signatures are release assets, not distributions
          verbose: true
          attestations: false

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
