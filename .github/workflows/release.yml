name: release

# Publishes on a version tag. The wheel carries the built SPA, so the release
# artifact is the whole product: `pipx install noirdeck` and run it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Build SPA and bundle it into the package
        run: |
          cd frontend && npm ci --no-fund --no-audit && npm run build && cd ..
          rm -rf backend/noirdeck/web
          cp -r frontend/dist backend/noirdeck/web

      # The issuer public key is baked in HERE, not in the checked-in source.
      # A source checkout must stay unlicensed so contributors and the test suite
      # can run without a keypair. Keeping the value out of git is what lets a
      # checkout and a wheel differ without a second copy of the source.
      #
      # NOIRDECK_LICENSING_MODE decides which kind of wheel this is:
      #   enforced      bake the key; gated features need a licence  (the default)
      #   early-access  ship unlicensed; every feature works
      #
      # It is an explicit value, never the absence of one. A build that became
      # unlicensed because someone forgot to set a variable is a silent failure
      # wearing a feature's clothes, so an unset mode still means enforced and
      # still fails when the key is missing.
      - name: Bake the issuer public key into the build
        if: vars.NOIRDECK_LICENSING_MODE != 'early-access'
        env:
          PUBKEY: ${{ vars.NOIRDECK_ISSUER_PUBKEY }}
        run: |
          test -n "$PUBKEY" || { echo "::error::NOIRDECK_ISSUER_PUBKEY repo variable is not set"; exit 1; }
          python - <<'EOF'
          import os, pathlib, re
          p = pathlib.Path("backend/noirdeck/licensing.py")
          s = p.read_text()
          s2 = re.sub(r'^_BAKED_ISSUER_PUBLIC_KEY = ""',
                      f'_BAKED_ISSUER_PUBLIC_KEY = "{os.environ["PUBKEY"]}"', s, count=1, flags=re.M)
          assert s2 != s, "could not find the placeholder to replace"
          p.write_text(s2)
          EOF
          # Fail loudly rather than ship a wheel with licensing switched off.
          python -c "import re,pathlib; t=pathlib.Path('backend/noirdeck/licensing.py').read_text(); m=re.search(r'_BAKED_ISSUER_PUBLIC_KEY = \"([^\"]*)\"', t); assert m and m.group(1), 'issuer key not baked'; print('baked issuer key, length', len(m.group(1)))"

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build

      - name: Verify the tag matches the packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "$PKG" || { echo "tag $TAG != pyproject $PKG"; exit 1; }
          ls dist/ | grep -q "noirdeck-$PKG-py3-none-any.whl"

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/noirdeck --version
          # the SPA must be inside the wheel, not resolved from this checkout
          /tmp/smoke/bin/python -c "import noirdeck.paths as p; assert p.web_dir() is not None, 'SPA missing from wheel'"
          # Assert the mode this build was ASKED for, in both directions. An
          # enforced wheel that shipped unlicensed would hand every paid feature
          # away; an early-access wheel that shipped licensed would lock out
          # everyone it was published for. Neither is allowed to pass quietly.
          MODE="${{ vars.NOIRDECK_LICENSING_MODE }}"
          MODE="${MODE:-enforced}"
          echo "licensing mode: $MODE"
          /tmp/smoke/bin/python - "$MODE" <<'PYEOF'
          import sys
          import noirdeck.licensing as licensing
          mode = sys.argv[1]
          if mode == "early-access":
              assert not licensing.active(), "early-access wheel shipped WITH licensing active"
              print("licensing inactive in wheel, as asked")
          else:
              assert licensing.active(), "enforced wheel shipped with licensing INACTIVE"
              print("licensing active in wheel, as asked")
          PYEOF
          # ⛔⛔ The guard shipped ABSENT from every wheel until 2026-08-19: it lived in
          # ops/, which is not packaged, so guard_settings_args() returned [] and every
          # unattended session ran with acceptEdits and no hook. It passed all tests
          # because tests run in a checkout where ops/ exists. Assert against the
          # INSTALLED package, and prove it actually denies rather than merely existing.
          /tmp/smoke/bin/python -c "
          from noirdeck.guard import guard_available, guard_settings_args, GUARD_SCRIPT
          assert guard_available(), f'guard MISSING from wheel at {GUARD_SCRIPT}'
          args = guard_settings_args()
          assert args and args[0] == '--settings', 'guard produced no hook settings'
          print('guard present in wheel:', GUARD_SCRIPT)
          "
          # and it must actually refuse a write into the operator's workspace
          echo '{"tool_name":"Write","tool_input":{"file_path":"'"$HOME"'/.claude/CLAUDE.md","content":"x"}}' \
            | /tmp/smoke/bin/python "$(/tmp/smoke/bin/python -c 'from noirdeck.guard import GUARD_SCRIPT; print(GUARD_SCRIPT)')" \
            && { echo "::error::the packaged guard ALLOWED a write to CLAUDE.md"; exit 1; } \
            || echo "packaged guard denies knowledge-tree writes"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC: PyPI trusted publishing + keyless signing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # Keyless: the signing identity is this workflow, so there is no long-lived
      # key to hold or rotate. Signs the SBOM too — an unattributable SBOM is
      # one of the 17 minimum elements missing.
      - name: Sign artifacts and SBOM
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.whl ./dist/*.tar.gz ./dist/sbom.cyclonedx.json

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # trusted publishing (OIDC) — no API token stored anywhere
          skip-existing: true
          packages-dir: dist/
          # signatures are release assets, not distributions
          verbose: true
          attestations: false

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
